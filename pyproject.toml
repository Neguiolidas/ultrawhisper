[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whispero"
version = "0.7.0"
description = "Universal audio transcription and deep analysis - fully offline local mode, Gemini native audio, plus any OpenAI-compatible API"
readme = "README.md"
authors = [{name = "Neguiolidas"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["audio", "transcription", "whisper", "speech-to-text", "ai-agents", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
diarize = ["pyannote.audio>=3.0"]
local = [
    "faster-whisper>=1.1",
    "onnxruntime>=1.17",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
    "scipy>=1.10",
]
dictate = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "Pillow>=9.0",
]
voiceid = [
    "onnxruntime>=1.17",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
]
hear = [
    "librosa>=0.10",
    "scipy>=1.10",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/Neguiolidas/whispero"
Repository = "https://github.com/Neguiolidas/whispero"
Issues = "https://github.com/Neguiolidas/whispero/issues"

[project.scripts]
whispero = "transcribe:main"
whispero-analyze = "audio_analyze:main"
whispero-dictate = "dictate:main"
whispero-enroll = "voiceid:main"
whispero-ears = "ears:main"
whispero-hear = "hear:main"

[tool.setuptools]
py-modules = ["transcribe", "audio_analyze", "dictate", "voiceid", "ears",
              "hear", "local_engine"]
