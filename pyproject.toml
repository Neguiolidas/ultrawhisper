[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whispero"
version = "0.1.0"
description = "Universal audio transcription and deep analysis - Gemini native audio plus any OpenAI-compatible API"
readme = "README.md"
authors = [{name = "Neguiolidas"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["audio", "transcription", "whisper", "speech-to-text", "ai-agents", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Neguiolidas/whispero"
Repository = "https://github.com/Neguiolidas/whispero"
Issues = "https://github.com/Neguiolidas/whispero/issues"

[project.scripts]
whispero = "transcribe:main"
whispero-analyze = "audio_analyze:main"

[tool.setuptools]
py-modules = ["transcribe", "audio_analyze"]
